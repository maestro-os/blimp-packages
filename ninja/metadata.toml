[package]
name = "ninja"
version = "1.13.2"
description = "Ninja is a small build system with a focus on speed."

[[source]]
location = "/"
url = "https://github.com/ninja-build/ninja/archive/refs/tags/v1.13.2.tar.gz"

[[package.dep]]
type = "build-and-run"
name = "musl"
version = "*"

[[package.dep]]
type = "build"
name = "bash"
version = "*"

[[package.dep]]
type = "build"
name = "bootstrap-binutils"
version = "*"

[[package.dep]]
type = "build"
name = "bootstrap-gcc"
version = "*"

[[package.dep]]
type = "build"
name = "coreutils"
version = "*"

[[package.dep]]
type = "build"
name = "sed"
version = "*"

[[package.dep]]
type = "build"
name = "python"
version = "*"
