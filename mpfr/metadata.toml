[package]
name = "mpfr"
version = "4.1.0"
description = "The MPFR library is a C library for multiple-precision floating-point computations with correct rounding."

[[source]]
location = "/"
url = "https://gcc.gnu.org/pub/gcc/infrastructure/mpfr-4.1.0.tar.bz2"

[[package.dep]]
type = "build-and-run"
name = "musl"
version = "*"

[[package.dep]]
type = "build-and-run"
name = "gmp"
version = "6.2.1"

[[package.dep]]
type = "build"
name = "diffutils"
version = "*"

[[package.dep]]
type = "build"
name = "gawk"
version = "*"

[[package.dep]]
type = "build"
name = "make"
version = "*"
