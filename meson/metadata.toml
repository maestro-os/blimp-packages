[package]
name = "meson"
version = "1.10.1"
description = "Meson is an open source build system meant to be both extremely fast, and, even more importantly, as user friendly as possible."

[[source]]
location = "/"
url = "https://github.com/mesonbuild/meson/releases/download/1.10.1/meson-1.10.1.tar.gz"

[[package.dep]]
type = "build-and-run"
name = "python"
version = "*"

[[package.dep]]
type = "build"
name = "bash"
version = "*"

[[package.dep]]
type = "build"
name = "setuptools"
version = "*"

[[package.dep]]
type = "build-and-run"
name = "zlib"
version = "*"
