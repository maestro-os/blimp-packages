[package]
name = "mkfontdir"
version = "1.0.7"
description = "Create an index of X font files in a directory (wrapper around mkfontscale)."

[[source]]
location = "/"
url = "https://www.x.org/releases/individual/app/mkfontdir-1.0.7.tar.gz"

[[package.dep]]
type = "build-and-run"
name = "mkfontscale"
version = "*"

